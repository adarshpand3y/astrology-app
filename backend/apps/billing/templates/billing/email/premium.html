<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F1ECE2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2B2118;">
  <div style="display:none;max-height:0;overflow:hidden;">{{ preheader }}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1ECE2;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;">
          <tr>
            <td style="padding:28px 32px 0;">
              <span style="font-size:22px;color:{{ accent }};">&#9789;</span>
              <span style="font-size:17px;font-weight:600;color:{{ accent }};vertical-align:3px;">&nbsp;{{ app_name }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 0;">
              <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;font-weight:600;">{{ heading }}</h1>
              <p style="margin:0;font-size:15px;line-height:1.55;color:#5C5047;">{{ intro }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 0;">
              {% for f in features %}
              <p style="margin:0 0 6px;font-size:14px;line-height:1.5;color:#2B2118;"><span style="color:{{ accent }};">&#10022;</span>&nbsp; {{ f }}</p>
              {% endfor %}
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:24px 32px 28px;">
              <a href="{{ url }}" style="display:inline-block;padding:14px 28px;background:{{ accent }};border-radius:12px;font-size:16px;font-weight:600;color:#FFFFFF;text-decoration:none;">{{ cta }}</a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px;border-top:1px solid #EFE8DC;">
              <p style="margin:18px 0 0;font-size:12px;line-height:1.55;color:#8A7E74;">You're getting this because you created a {{ app_name }} account. <a href="{{ unsubscribe }}" style="color:#8A7E74;">Unsubscribe</a></p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-size:12px;color:#A39A90;">{{ app_name }} · {{ tagline }}</p>
      </td>
    </tr>
  </table>
</body>
</html>
